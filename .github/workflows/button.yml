# keeps the hotlinkable 88x31 (public/img/button.gif + .png) in sync with the
# github pfp and discord profile. renders hourly; commits and redeploys the
# site only when something actually changed.
#
# needs repo secret CLOUDFLARE_API_TOKEN (account > cloudflare pages > edit)

name: sync button

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "re-render even if nothing changed"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: button
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: install chromium
        run: bunx playwright install --with-deps chromium

      - name: render
        id: render
        run: node scripts/button/render.mjs ${{ inputs.force && '--force' || '' }}

      - name: commit
        if: steps.render.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/img/button.gif public/img/button.png scripts/button/.fingerprint
          git commit -m "sync 88x31 button with profile"
          git push

      - name: deploy
        if: steps.render.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: eda578913d16a47ec2ea643ff93eddab
        run: bun run deploy
